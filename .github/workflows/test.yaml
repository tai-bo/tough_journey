name: Test Cloud Run - api
run-name: >-
  Test in ${{
    github.event.pull_request.base.ref == 'tai-pr-tst' && 'tai-pr-tst' || 
    github.event.pull_request.base.ref == 'tai-pr-prd' && 'tai-pr-prd' || 
    github.ref_name == 'tai-pr-tst' && 'tai-pr-tst' || 
    github.ref_name == 'tai-pr-prd' && 'tai-pr-prd' || 
    'tai-pr-dev'
  }}

on:
  push:
    branches:
      - add_pytest_save_transcription_20260422
  workflow_dispatch:
  # manually trigger

permissions:
  id-token: write
  contents: read

env:
  GCP_SERVICE_ACCOUNT_DEV: ${{ secrets.GCP_RUNNER_SA_DEV }}
  GCP_SERVICE_ACCOUNT_TST: ${{ secrets.GCP_RUNNER_SA_TST }}

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get project id
        id: get-project-id
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [[ "$BRANCH" == "tai-pr-dev" || "$BRANCH" == "tai-pr-tst" || "$BRANCH" == "tai-pr-prd" ]]; then
            PROJECT_ID="$BRANCH"
          else
            PROJECT_ID="tai-pr-dev"
          fi

          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Set gcp sa
        id: set-sa
        run: |
          PROJECT_ENV=${PROJECT_ID: -3}
          echo "project env: $PROJECT_ENV"
          case $PROJECT_ENV in
            dev) echo "GCP_SERVICE_ACCOUNT=$GCP_SERVICE_ACCOUNT_DEV" >> $GITHUB_ENV ;;
            tst) echo "GCP_SERVICE_ACCOUNT=$GCP_SERVICE_ACCOUNT_TST" >> $GITHUB_ENV ;;
            *) echo "Invalid" ; exit 1 ;;
          esac
      
      - name: GCP WIF
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
            workload_identity_provider: ${{ secrets.GCP_WIF }}
            service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
            create_credentials_file: true
      
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: 'latest'
      
      - name: Grant Permission to Docker User
        run: |
          sudo chown 1000:1000 ${{ steps.auth.outputs.credentials_file_path }}
          sudo chmod 644 ${{ steps.auth.outputs.credentials_file_path }}

      - name: Run Docker Compose Tests
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          VOL: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          docker compose up --build --abort-on-container-exit
